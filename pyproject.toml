[project]
name = "zid_integration"
authors = [{ name = "PACT", email = "jamunachi007@gmail.com" }]
description = "Import ZID e-commerce orders into ERPNext as POS Sales Invoices"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
